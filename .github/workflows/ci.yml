name: CI
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # Erreurs de syntaxe et noms indéfinis uniquement : le code dépend des modules Arduino, absents du CI.
      - run: ruff check python --select E9,F63,F7,F82
      - run: python -m py_compile python/main.py
